name: Repository Automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  analyze-and-document:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Needed for changelog and history

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Repository Analyzer
      run: python scripts/repo_analyzer.py

    - name: Build Knowledge Graph
      run: python scripts/knowledge_graph.py

    - name: Generate Architecture Diagrams
      run: python scripts/diagram_generator.py

    - name: Update README and Documentation
      run: python scripts/readme_generator.py

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "docs: auto-update repository documentation and diagrams [skip ci]"
        file_pattern: 'README.md docs/ knowledge_graph.json repo_structure.json'
